[package]
name = "wanderdex"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "wanderdex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = ["tray-icon", "macos-private-api", "protocol-asset", "image-png", "unstable"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-opener = "2.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21.1"
png = "0.18.1"
rand = "0.10.3"
rand_chacha = "0.10.0"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2", "system-proxy"] } # OS TLS: no bundled crypto library
thiserror = "2"

# Native pet windows (see src/native.rs). Same versions tauri already uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSString"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSEvent", "NSImage", "NSResponder", "NSScreen", "NSView"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CATransaction"] }

[dev-dependencies]
tempfile = "3"

# Small, fast release binaries. See https://v2.tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
