name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri
            setup/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo check --locked --manifest-path setup/src-tauri/Cargo.toml

  # Known-vulnerable or unmaintained crates and npm packages, licenses outside deny.toml, crates from
  # unknown sources. Not a required check: a new advisory shouldn't block unrelated PRs, but it shows here.
  dependencies:
    runs-on: ubuntu-latest
    env:
      DENY_VERSION: 0.20.2
      DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Install cargo-deny (checksum-pinned release)
        run: |
          name="cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl"
          curl -sSfL -o deny.tar.gz "https://github.com/EmbarkStudios/cargo-deny/releases/download/$DENY_VERSION/$name.tar.gz"
          echo "$DENY_SHA256  deny.tar.gz" | sha256sum -c -
          tar -xzf deny.tar.gz && install "$name/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
      - run: cargo deny --manifest-path src-tauri/Cargo.toml check
      - run: cargo deny --manifest-path setup/src-tauri/Cargo.toml check
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10 }
      - run: pnpm audit
