name: Preview build
# Builds the installers from any branch without releasing them. Run it from the Actions tab
# ("Run workflow"), then download the installers from the run's Artifacts section.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri
            setup/src-tauri
      - run: pnpm install --frozen-lockfile

      - name: Build the macOS .dmg (universal)
        if: runner.os == 'macOS'
        run: |
          pnpm tauri build --target universal-apple-darwin --bundles app
          mkdir -p out
          pipx run --spec dmgbuild==1.6.5 dmgbuild -s src-tauri/dmg/settings.py \
            -D app=src-tauri/target/universal-apple-darwin/release/bundle/macos/Wanderdex.app \
            Wanderdex "out/Wanderdex_preview_universal.dmg"

      - name: Build the Windows installer
        if: runner.os == 'Windows'
        # The custom setup app (setup/) embeds the NSIS installer and runs it silently.
        run: |
          pnpm tauri build --bundles nsis
          nsis=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
          (cd setup && WANDERDEX_INSTALLER="$GITHUB_WORKSPACE/$nsis" ../node_modules/.bin/tauri build --no-bundle)
          mkdir -p out
          cp setup/src-tauri/target/release/wanderdex-setup.exe out/Wanderdex_preview_x64-setup.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wanderdex-${{ runner.os }}
          path: out/
          retention-days: 14
          if-no-files-found: error
