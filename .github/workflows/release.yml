name: Release
# Cut a release by pushing a vX.Y.Z tag on main. See "Releasing" in CONTRIBUTING.md.
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
env:
  TAG: ${{ github.ref_name }}
  GH_REPO: ${{ github.repository }}
jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: Tag is on main and matches the app version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$TAG is not on main"; exit 1; }
          pkg=$(node -p "require('./package.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          [ "$TAG" = "v$pkg" ] || { echo "::error::tag $TAG but package.json is $pkg"; exit 1; }
          [ "$cargo" = "$pkg" ] || { echo "::error::Cargo.toml is $cargo but package.json is $pkg"; exit 1; }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: src-tauri }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  draft:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" --draft --verify-tag --title "Wanderdex $TAG" --generate-notes \
            --notes "Download the .dmg (macOS) or the -setup.exe (Windows). See the README for first-launch steps on unsigned apps."

  build:
    needs: draft
    permissions:
      contents: write # upload installers to the draft release
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri
            setup/src-tauri
      - run: pnpm install --frozen-lockfile

      - name: Build the macOS .dmg (universal)
        if: runner.os == 'macOS'
        run: |
          pnpm tauri build --target universal-apple-darwin --bundles app
          out="Wanderdex_${TAG#v}_universal.dmg"
          pipx run --spec dmgbuild==1.6.5 dmgbuild -s src-tauri/dmg/settings.py \
            -D app=src-tauri/target/universal-apple-darwin/release/bundle/macos/Wanderdex.app Wanderdex "$out"
          gh release upload "$TAG" "$out"

      - name: Build the Windows installer
        if: runner.os == 'Windows'
        # The custom setup app (setup/) embeds the NSIS installer and runs it silently.
        run: |
          pnpm tauri build --bundles nsis
          nsis=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
          (cd setup && WANDERDEX_INSTALLER="$GITHUB_WORKSPACE/$nsis" ../node_modules/.bin/tauri build --no-bundle)
          out="Wanderdex_${TAG#v}_x64-setup.exe"
          cp setup/src-tauri/target/release/wanderdex-setup.exe "$out"
          gh release upload "$TAG" "$out"
