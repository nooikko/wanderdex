version: 2
# The 7-day cooldown skips releases younger than a week, the usual window for a hijacked package to be
# caught and pulled. Security updates ignore it.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # Vite, its React plugin and Vitest are upgraded together: @vitejs/plugin-react only works with one
      # Vite major. Listed first so it also catches their major versions.
      vite:
        patterns: ["vite", "vitest", "@vitejs/*", "@vitest/*"]
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "cargo"
    directories: ["/src-tauri", "/setup/src-tauri"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
