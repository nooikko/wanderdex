[package]
name = "wanderdex-setup"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "2.8.2"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
# Same library and app name the Wanderdex autostart plugin uses, so its "Launch at login" toggle agrees with setup.
auto-launch = "0.6.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
